{{- if .Values.pythonJob.enabled }}
{{- if or .Values.pythonJob.scriptContent .Values.pythonJob.bundleContent }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "name" . }}-{{ .Values.pythonJob.name }}-source
  labels:
    {{- include "labels" . | nindent 4 }}
data:
  job.py: |
    {{ .Values.pythonJob.scriptContent | nindent 4 }}
  requirements.txt: |
    {{ .Values.pythonJob.requirementsContent | nindent 4 }}
{{- if .Values.pythonJob.bundleContent }}
binaryData:
  # Whole job folder (job.py + its packages), tar.gz, base64-encoded.
  bundle.tgz: {{ .Values.pythonJob.bundleContent | trim }}
{{- end }}
---
{{- end }}
{{- if .Values.pythonJob.secretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "name" . }}-{{ .Values.pythonJob.name }}-secret
  labels:
    {{- include "labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.pythonJob.secretEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "name" . }}-{{ .Values.pythonJob.name }}
  labels:
    {{- include "labels" . | nindent 4 }}
spec:
  template:
    metadata:
      labels:
        {{- include "labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ include "name" . }}-{{ .Values.pythonJob.name }}
          image: {{ .Values.pythonJob.image.repository }}:{{ .Values.pythonJob.image.tag }}
          imagePullPolicy: {{ .Values.pythonJob.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              set -e
              if [ -f /source/bundle.tgz ]; then
                echo "Unpacking job bundle..."
                tar -xzf /source/bundle.tgz -C /app
              else
                cp /source/job.py /source/requirements.txt /app/
              fi
              cd /app
              if [ -f requirements.txt ]; then
                echo "Installing pipeline dependencies from requirements.txt..."
                pip install --no-cache-dir -r requirements.txt
              fi
              python job.py
          {{- if .Values.pythonJob.env }}
          env:
            {{- range $key, $value := .Values.pythonJob.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          {{- if .Values.pythonJob.secretEnv }}
          envFrom:
            - secretRef:
                name: {{ include "name" . }}-{{ .Values.pythonJob.name }}-secret
          {{- end }}
          volumeMounts:
            - name: app
              mountPath: /app
          {{- if or .Values.pythonJob.scriptContent .Values.pythonJob.bundleContent }}
            - name: source
              mountPath: /source
          {{- end }}
          resources:
            limits:
              cpu: {{ .Values.pythonJob.resources.limits.cpu }}
              memory: {{ .Values.pythonJob.resources.limits.memory }}
            requests:
              cpu: {{ .Values.pythonJob.resources.requests.cpu }}
              memory: {{ .Values.pythonJob.resources.requests.memory }}
      volumes:
        - name: app
          emptyDir: {}
      {{- if or .Values.pythonJob.scriptContent .Values.pythonJob.bundleContent }}
        - name: source
          configMap:
            name: {{ include "name" . }}-{{ .Values.pythonJob.name }}-source
      {{- end }}
      restartPolicy: {{ .Values.pythonJob.restartPolicy }}
  backoffLimit: {{ .Values.pythonJob.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.pythonJob.ttlSecondsAfterFinished }}
{{- end }}
